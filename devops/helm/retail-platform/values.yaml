global:
  projectId: YOUR_GCP_PROJECT_ID
  region: asia-south1
  env: prod
  namespace: retail
  imageRegistry: asia-south1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/retail
  imageTag: "1.0.0"
  cloudSql:
    instanceConnectionName: PROJECT:REGION:retail-prod-pg
  serviceAccount:
    create: true
    name: retail-app
    gsaEmail: retail-workload@YOUR_GCP_PROJECT_ID.iam.gserviceaccount.com
  podSecurity:
    runAsNonRoot: true
    runAsUser: 65532
    readOnlyRootFilesystem: true
  networkPolicy:
    enabled: true

gateway:
  enabled: true
  hostname: shop.example.com
  adminHostname: admin.example.com

bff:
  exposeViaGateway: true
  replicas: 3

# Per-service overrides; full list in services.generated.yaml
services: []
