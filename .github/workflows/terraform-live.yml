name: terraform-live

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, qa, test, prod]
      action:
        description: Terraform action
        required: true
        type: choice
        options: [plan, apply]
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-live.yml"

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    env:
      TF_ENV: ${{ github.event.inputs.environment || 'dev' }}
      TF_ACTION: ${{ github.event.inputs.action || 'plan' }}
      TF_VAR_database_password: ${{ secrets.TF_VAR_DATABASE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform all stacks
        run: |
          chmod +x infra/scripts/tf-apply-all.sh infra/scripts/tf.sh
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ./infra/scripts/tf-apply-all.sh "${TF_ENV}" plan
          else
            ./infra/scripts/tf-apply-all.sh "${TF_ENV}" "${TF_ACTION}"
          fi
