name: E2E CI

on:
  push:
    branches: [main]
    paths:
      - "application/**"
      - "testing/e2e/**"
      - "devops/db/**"
      - "docker-compose.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "application/**"
      - "testing/e2e/**"
      - "devops/db/**"
      - "docker-compose.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e-ci.yml"

concurrency:
  group: e2e-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: E2E CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: E2E smoke (Postgres + APIs)
        run: |
          chmod +x testing/e2e/run-smoke.sh application/scripts/*.sh
          bash testing/e2e/run-smoke.sh
